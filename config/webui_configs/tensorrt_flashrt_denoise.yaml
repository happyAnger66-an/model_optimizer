# lerobot_eval_webui_server —— TensorRT(vit/llm) + 仓内 FlashRT decoder(denoise) 混合推理。
# 用法：
#   python scripts/deployment/pi05/lerobot_eval_webui_server.py \
#     --webui-config config/webui_configs/tensorrt_flashrt_denoise.yaml
#
# 说明：
# - vit/llm 仍走 TensorRT；denoise 整 10 步循环由仓内移植的 FlashRT decoder 覆盖（静态 FP8）。
# - 不依赖 flash_rt python 包；仅按 .so 路径装载 Thor 上构建的 kernel。
#   先在 Thor 上构建：bash scripts/deployment/pi05/build_flashrt_kernels.sh
#   然后把构建目录填到 native_flashrt_build_dir（或设环境变量 MO_FLASHRT_BUILD_DIR）。
# - 首跑离线量化：把 native_flashrt_calibrate 设 true、native_flashrt_act_scales_path 设输出路径，
#   跑一次导出 act scales；之后改回 false 即自动加载该 scale。
# —— 模型与数据集 ——
checkpoint: /srcs/openpi/pytorch_pi05_libero/  # π0.5 策略 checkpoint 目录（必填）
config: pi05_libero                             # openpi 训练/模型配置名（决定数据集与模型结构）
inference_mode: tensorrt                        # 单路后端：此处用 tensorrt（vit/llm 走 TRT，denoise 由 native 叠加覆盖）
device: cuda:0                                  # 推理设备
precision: bf16                                 # PyTorch 侧推理精度（TRT 路由引擎自身精度决定）
vit_batch_views: true                           # ViT 多视角 batching（须配套用 batch 版 vit engine）
trt_vit_scale_fix: true                        # TRT ViT 补乘 sqrt(hidden_size)，修复 vit.engine 精度偏低

# —— TensorRT 引擎路径（vit/llm 仍走 TRT） ——
engine_path: /tmp/build/pi05/opt                # TRT 引擎根目录（含各子图 .engine）
vit_engine: vit_fp8_batch.engine                # ViT 引擎文件名（FP8 + 多视角 batch）
llm_engine: llm_fp8.engine                # LLM 引擎文件名（NVFP4 低时延版）
denoise_engine: ""                              # 留空：denoise 不走 TRT，交给下面的 native FlashRT decoder

# —— TRT engine 运行开关（仅作用于 vit/llm 这类 TRT 引擎） ——
trt_perf: true                                  # 打印各 TRT 引擎逐次/汇总耗时
trt_perf_warmup: 20                             # 统计前 warmup 次数（排除冷启动）
trt_perf_print_interval: 50                     # 每 N 次推理打印一次 perf
trt_cuda_graph: true                            # 对 TRT 引擎启用 CUDA Graph capture/replay
trt_cuda_graph_warmup: 3                        # CUDA Graph capture 前 warmup 次数

# —— Native 叠加：在 TRT 上覆盖部分阶段（这里仅覆盖 denoise） ——
native_overlay_on_tensorrt: true                # 在 tensorrt 模式上叠加 native runtime（不替换 vit/llm）
native_enable_expert: false                     # 不覆盖 expert（保持 TRT/PyTorch 原路径）
native_enable_denoise: true                     # 覆盖 denoise（交给 native，下方 flashrt 生效）
native_use_cuda_graph: false                    # FlashRT 不用 PyTorch denoise_step CUDA Graph（勿设 true）
native_full_loop_graph: false

# —— 仓内 FlashRT decoder（不依赖 flash_rt 包，整 10 步循环替代 denoise loop） ——
native_flashrt_decoder: true                    # 启用仓内 FlashRT decoder（静态 FP8 整循环）
native_flashrt_build_dir: "/srcs/mopt/FlashRT/flash_rt/"   # flash_rt_kernels*.so 所在目录（Thor 上构建产物；不设则用环境变量 MO_FLASHRT_BUILD_DIR）
native_flashrt_fmha_so: ""                              # 可选 CUTLASS FMHA（libfmha_fp16_strided.so）路径；空则不加载
native_flashrt_use_fp8: false                    # true=静态 FP8 布局；false=fp16 baseline（精度对照/调试用）
native_flashrt_act_scales_path: "/tmp/quantize/pi05/flashrt_decoder_act_scales.json"  # 激活量化 scale JSON（离线量化导出/加载路径）
native_flashrt_calibrate: false                 # 首跑导出 act scales 时设 true；导出后改回 false 即自动加载上面的文件
native_flashrt_calib_samples: 8                  # 标定累计样本数：跨 N 个 observation + 每样本跨 10 步，对激活 scale 取 max（提升 FP8 鲁棒性）

# —— 性能 profile（chunk 级分解 + 各阶段/引擎耗时） ——
perf_profile_chunk: true                        # 打印 chunk 级分解耗时（数据读取/重排/推理/后处理/总计）
perf_profile_warmup_chunks: 10                  # profile 统计前跳过的 chunk 数
perf_profile_print_interval: 20                 # 每 N 个 chunk 打印一次 profile
perf_profile_top_n: 3                           # 瓶颈排名输出 Top-N
trt_enable_stage_profile: false                 # FlashRT 下 denoise_step 不走 PyTorch；用 StagePerfCollector 的 denoise.total
trt_stage_profile_warmup: 10                    # 若改回 true：按 sample_actions 次数 warmup
trt_enable_hook_profile: true                   # 启用 forward hook 级耗时统计（更细粒度）

# —— 评估区间与可复现 noise ——
num_samples: 500                                # 评估样本数（按数据集 global index 推进）
start_index: 0                                  # 数据集起始 global index
noise: fixed                                    # 流匹配初值：fixed=确定性高斯（可复现）；random=模型内随机采样
noise_seed: 0                                   # noise=fixed 时与 chunk 起点共同决定初值

# —— WebSocket 服务 ——
host: 0.0.0.0                                   # 监听地址
port: 8765                                      # 监听端口（client 连 ws://<host>:<port>/ws）
wait_for_client: true                           # 首个 WebSocket 客户端连接后再开始推理，避免页面只收到 meta
history_size: 4096                              # 浏览器刷新/晚连时回放最近 step，避免图表为空
