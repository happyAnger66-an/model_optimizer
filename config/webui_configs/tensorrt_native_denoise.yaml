# lerobot_eval_webui_server —— TensorRT(vit/llm) + FlashRT decoder(denoise) 混合推理。
# 用法（需两个终端）：
#   # 终端 1：WebSocket 评估服务
#   python scripts/deployment/pi05/lerobot_eval_webui_server.py \
#     --webui-config config/webui_configs/tensorrt_native_denoise.yaml
#   # 终端 2：静态页（勿用 file:// 双击 index.html）
#   cd scripts/deployment/pi05/webui_client && python -m http.server 8080
#   # 浏览器打开 http://127.0.0.1:8080/ ，页面会自动连 ws://127.0.0.1:8765/ws
#
# 说明（目标对齐）：
# - denoise 后端是仓内 FlashRT（``native_flashrt_decoder: true``），整 10 步循环一次跑完。
# - **不是** PyTorch native 的 ``denoise_step`` + CUDA Graph；若看到 ``[native] capture invalidated``
#   说明误走了 native PyTorch graph 路径（本文件已关闭）。
# - vit/llm 仍走 TensorRT；``denoise_engine`` 留空。
# - 更完整的 FlashRT 注释与 FP8 标定说明见 ``tensorrt_flashrt_denoise.yaml``。
# - Thor 上先构建 kernel：``bash scripts/deployment/pi05/build_flashrt_kernels.sh``
checkpoint: /srcs/openpi/pytorch_pi05_libero/
config: pi05_libero
inference_mode: tensorrt
device: cuda:0
precision: bf16
vit_batch_views: true

engine_path: /tmp/build/pi05/opt
vit_engine: vit_fp8_batch.engine
llm_engine: llm_kv_fp8.engine
denoise_engine: ""

# —— TRT engine 开关（vit/llm） ——
trt_perf: true
trt_perf_warmup: 20
trt_perf_print_interval: 50
trt_cuda_graph: true
trt_cuda_graph_warmup: 3

# —— Native 叠加：仅 denoise 走 FlashRT ——
native_overlay_on_tensorrt: true
native_enable_expert: false
native_enable_denoise: true
native_use_cuda_graph: false
native_full_loop_graph: false

# —— FlashRT decoder（denoise 后端） ——
native_flashrt_decoder: true
native_flashrt_build_dir: "/srcs/mopt/FlashRT/build"
native_flashrt_fmha_so: ""
native_flashrt_use_fp8: false
native_flashrt_act_scales_path: "/tmp/quantize/pi05/flashrt_decoder_act_scales.json"
native_flashrt_calibrate: false
native_flashrt_calib_samples: 8

# —— 性能 profile ——
# FlashRT 路径用 StagePerfCollector（denoise.total / flashrt.setup）；Pi0 stage profiler 的
# denoise_step 统计对 FlashRT 无意义且易误导，建议保持 false。
perf_profile_chunk: true
perf_profile_warmup_chunks: 10
perf_profile_print_interval: 20
perf_profile_top_n: 3
trt_enable_stage_profile: false
trt_stage_profile_warmup: 10
trt_enable_hook_profile: true

num_samples: 500
start_index: 0
noise: fixed
noise_seed: 0

host: 0.0.0.0
port: 8765
wait_for_client: true
history_size: 4096
