# lerobot_eval_webui_server —— 全 TensorRT 引擎推理（vit/llm/expert/denoise）。
# 用法：
#   python scripts/deployment/pi05/lerobot_eval_webui_server.py \
#     --webui-config config/webui_configs/tensorrt_full.yaml
#
# engine_path 为引擎目录；各 *_engine 是该目录下的文件名。未提供的阶段回退 PyTorch。
checkpoint: /srcs/openpi/pytorch_pi05_libero/
config: pi05_libero
inference_mode: tensorrt
device: cuda:0
precision: bf16
denoise_adarms_precompute: true
vit_batch_views: true
# 部分 vit.engine 输出少乘 sqrt(hidden_size)，开启后与 PyTorch 对齐（等价 PI05_TRT_VIT_SCALE_FIX=1）
trt_vit_scale_fix: true

# 双路 PT vs TRT 对比；仅看单路全 TRT 性能时请改为 false
compare_mode: true
engine_path: /tmp/build/pi05/opt
vit_engine: vit.engine
llm_engine: llm_fp8.engine
#denoise_engine: denoise_st_fp8.engine

# WebUI：须用 http 打开 webui_client（勿 file://）；首个 WS 连接后再开始推理
wait_for_client: true
history_size: 4096

# —— TRT engine 运行开关 ——
# perf：>100 次后打印各 engine 的耗时统计；cuda_graph：捕获/回放降低 launch 开销（输入 shape 稳定时安全）。
trt_perf: true
trt_perf_warmup: 20
trt_perf_print_interval: 50
trt_cuda_graph: true
trt_cuda_graph_warmup: 3
perf_profile_chunk: true
perf_profile_warmup_chunks: 10
perf_profile_print_interval: 20
perf_profile_top_n: 3
trt_enable_stage_profile: true
trt_stage_profile_warmup: 10
trt_enable_hook_profile: true

num_samples: 200
start_index: 0
noise: fixed
noise_seed: 0

host: 0.0.0.0
port: 8765
